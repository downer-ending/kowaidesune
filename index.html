<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本語ノート</title>
<style>
:root{
  --paper:#FBF4F7; --surface:#FFFFFF; --ink:#332A2E; --muted:#9A9298; --line:#ECE4E8;
  --accent:#AF6580; --accent-soft:#F1E6EA; --seen:#5E8B6B; --blank:#B45C73;
  --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"SFMono-Regular",Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --paper:#101011; --surface:#1A1A1C; --ink:#ECE7E9; --muted:#8A8A8E; --line:#2A2A2E;
  --accent:#D9A0AE; --accent-soft:#201A1D; --seen:#8FB98F; --blank:#DFA6B2;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}
.shell{max-width:640px;margin:0 auto;padding:22px 20px 70px;}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;}
.title{font-family:var(--jp);font-size:19px;letter-spacing:.02em;font-weight:600;}
.head-r{display:flex;align-items:center;gap:12px;}
.meta{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;line-height:1.5;}
.theme{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:20px;width:34px;height:34px;cursor:pointer;font-size:15px;}
.tabs{display:flex;gap:2px;margin:16px 0 22px;}
.tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
.tab .jp{font-family:var(--jp);font-size:16px;color:var(--ink);opacity:.5;}
.tab .rom{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.tab.active{border-bottom-color:var(--accent);}
.tab.active .jp{opacity:1;}
.tab.active .rom{color:var(--accent);}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.btn{font-family:var(--sans);font-size:13px;background:var(--accent);color:var(--paper);border:none;border-radius:7px;padding:9px 14px;cursor:pointer;}
.btn:disabled{opacity:.45;cursor:default;}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line);}
.sel,.inp{font-family:var(--sans);font-size:13px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);flex:1;min-width:0;}
.inp{font-family:var(--jp);}
.note,.empty{color:var(--muted);font-size:13px;line-height:1.55;margin:8px 0;}
.warn{font-family:var(--mono);font-size:10px;color:#b07a3f;margin-top:6px;}
.err{color:#c06a6a;font-size:13px;margin:8px 0;}
.ok{color:var(--seen);font-family:var(--mono);font-size:11px;margin-top:8px;}
.block{margin-bottom:26px;}
.block-h{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.modes,.catbar,.toggle{display:flex;gap:2px;background:var(--accent-soft);border-radius:9px;padding:3px;margin-bottom:14px;flex-wrap:wrap;}
.modes button,.catbar button,.toggle button{flex:1;border:none;background:none;font-family:var(--jp);font-size:13px;padding:8px 6px;border-radius:7px;color:var(--muted);cursor:pointer;white-space:nowrap;}
.modes button .s,.catbar button .s{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.05em;text-transform:uppercase;margin-top:2px;}
.toggle button{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;}
.modes button.on,.catbar button.on,.toggle button.on{background:var(--surface);color:var(--accent);}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:18px;margin-top:14px;}
.q-jp{font-family:var(--jp);font-size:21px;line-height:1.7;}
.q-verb{font-family:var(--jp);font-size:26px;}
.q-arrow{color:var(--muted);margin:0 10px;}
.q-form{font-family:var(--mono);font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;}
.blank{color:var(--blank);font-weight:600;border-bottom:2px solid var(--blank);padding:0 5px;}
.hint{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:10px;}
.reveal{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
.reading{font-family:var(--jp);color:var(--muted);font-size:15px;line-height:1.7;}
.en{font-size:14px;margin-top:6px;line-height:1.5;}
.answer{font-family:var(--jp);font-size:18px;color:var(--seen);margin-top:4px;}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:4px;margin-top:10px;}
.judge{font-family:var(--mono);font-size:12px;margin-top:8px;}
.judge.good{color:var(--seen);}
.judge.bad{color:var(--blank);}
.ta{width:100%;font-family:var(--jp);font-size:14px;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical;margin:10px 0;}
.lesson{display:flex;align-items:center;gap:16px;}
.step{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:20px;color:var(--accent);cursor:pointer;}
.lesson-n{display:flex;flex-direction:column;align-items:center;min-width:70px;}
.lesson-n span{font-size:22px;font-weight:600;}
.lesson-n small{font-family:var(--mono);font-size:10px;color:var(--muted);}
.stats{display:flex;gap:24px;}
.stats>div{display:flex;flex-direction:column;}
.stats b{font-size:22px;}
.stats span{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.dict-in{width:100%;font-family:var(--jp);font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);}
.kana-live{font-family:var(--jp);font-size:13px;color:var(--muted);margin:6px 2px 0;min-height:18px;}
.entry{border-bottom:1px solid var(--line);padding:14px 0;cursor:pointer;}
.entry-top{display:flex;align-items:baseline;gap:12px;}
.entry-k{font-family:var(--jp);font-size:22px;}
.entry-r{font-family:var(--jp);font-size:14px;color:var(--muted);}
.entry-pos{font-family:var(--mono);font-size:9px;color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:4px;margin-left:auto;text-transform:uppercase;}
.entry-en{font-size:14px;margin-top:4px;}
.detail{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);}
.detail-h{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:10px 0 5px;}
.exs .exj{font-family:var(--jp);font-size:16px;}
.exs .exr{font-family:var(--jp);font-size:12px;color:var(--muted);}
.exs .exe{font-size:12px;color:var(--muted);}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-family:var(--jp);font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:4px 10px;cursor:pointer;}
.crows{margin-top:4px;}
.cgroup{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--seen);margin:14px 0 4px;}
.crow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line);}
.crow .ck{font-family:var(--mono);font-size:11px;color:var(--muted);}
.crow .cv{font-family:var(--jp);font-size:17px;text-align:right;}
.glist{list-style:none;padding:0;margin:0;}
.glesson{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;margin:18px 0 6px;}
.gitem{border-bottom:1px solid var(--line);padding:10px 0;cursor:pointer;}
.gitem-top{display:flex;align-items:baseline;gap:10px;}
.gp{font-family:var(--jp);font-size:15px;flex:1;}
.gg{font-size:12px;color:var(--muted);}
.gt{font-family:var(--mono);font-size:9px;color:var(--seen);}
.gx{font-size:13px;line-height:1.6;color:var(--ink);margin-top:8px;padding-left:2px;border-left:2px solid var(--accent-soft);padding-left:10px;}
.out{margin-top:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:9px;}
.out p{font-size:14px;line-height:1.6;margin:0 0 10px;white-space:pre-wrap;}
.saved{list-style:none;padding:0;margin:0;}
.saved li{position:relative;padding:12px 26px 12px 0;border-bottom:1px solid var(--line);}
.saved-t{font-family:var(--jp);font-size:15px;margin-bottom:4px;}
.saved-b{font-size:13px;color:var(--muted);line-height:1.55;white-space:pre-wrap;}
.x{position:absolute;top:10px;right:0;border:none;background:none;color:var(--muted);font-size:18px;cursor:pointer;}
.settings summary{font-family:var(--mono);font-size:11px;color:var(--muted);cursor:pointer;text-transform:uppercase;letter-spacing:.08em;}
.settings[open] summary{margin-bottom:10px;}
@media (max-width:480px){.shell{padding:16px 14px 60px;}.q-jp{font-size:19px;}}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<script>
"use strict";

/* ===== GENKI I (3rd ed) grammar, all 12 lessons, with explanations ===== */
var GENKI={
 1:[{id:"1a",p:"XはYです",g:"X is Y",t:"identity",x:"は marks the topic and です is the polite 'to be'. Word order is topic + comment + です, as in わたしはがくせいです (I am a student). Here です just links two nouns and does not change form."},
    {id:"1b",p:"noun の noun",g:"noun linking",x:"の joins two nouns, usually showing possession or an attribute: わたしのほん (my book), にほんごのせんせい (Japanese teacher). The second noun is the head and the first modifies it."},
    {id:"1c",p:"〜も",g:"also / too",t:"particle",x:"も replaces は or が to mean 'also/too': わたしもがくせいです (I am a student too). It signals the same thing applies to this item as well."},
    {id:"1d",p:"〜か",g:"question marker",x:"Add か to the end of a statement to make it a question: がくせいですか (Are you a student?). No word-order change and no question mark are needed."}],
 2:[{id:"2a",p:"これ・それ・あれ・どれ",g:"this / that / which",x:"Standalone pronouns by distance: これ (near me), それ (near you), あれ (away from both), どれ (which). They stand alone and do not attach to a noun."},
    {id:"2b",p:"この・その・あの + 名詞",g:"this ~ / that ~",x:"Same distance system, but placed before a noun: このほん (this book). Use these when you name the noun; use これ/それ/あれ when the noun is understood."},
    {id:"2c",p:"ここ・そこ・あそこ・どこ",g:"here / there / where",x:"Place words: ここ (here), そこ (there by you), あそこ (over there), どこ (where). Often paired with は or に."},
    {id:"2d",p:"だれの〜",g:"whose ~",x:"だれの means 'whose': これはだれのかばんですか (Whose bag is this?). It is simply だれ (who) plus の."},
    {id:"2e",p:"〜じゃないです",g:"is not (noun)",x:"Negative of noun + です: がくせいじゃないです (is not a student). A more formal equivalent is ではありません."},
    {id:"2f",p:"〜ね・〜よ",g:"final particles",x:"Sentence-final particles that color the tone. ね seeks agreement ('right?'), よ asserts new information to the listener ('you know')."}],
 3:[{id:"3a",p:"動詞ます・ません",g:"polite non-past",t:"conj",x:"Polite non-past endings on the verb stem: ます = affirmative, ません = negative. たべます / たべません. Non-past covers both habitual and future."},
    {id:"3b",p:"〜を",g:"direct object",t:"particle",x:"を marks the direct object of a transitive verb: パンをたべます (eat bread). It is not used with intransitive verbs."},
    {id:"3c",p:"〜で",g:"place of action",t:"particle",x:"で marks where an action happens: カフェでのみます (drink at a cafe). Contrast with に, which marks a destination or where something exists."},
    {id:"3d",p:"〜に・〜へ",g:"destination / time",t:"particle",x:"に marks a destination or a specific time (だいがくにいく, さんじに), and へ marks direction toward. Relative time words like きょう take no particle."},
    {id:"3e",p:"〜ませんか",g:"won't you ~?",t:"pattern",x:"An invitation, 'won't you...?': たべませんか (Won't you eat?). It is softer and more polite than ましょう."},
    {id:"3f",p:"頻度の副詞",g:"frequency adverbs",x:"Adverbs of frequency: よく (often), ときどき (sometimes), あまり (not much), ぜんぜん (not at all). あまり and ぜんぜん require a negative verb."}],
 4:[{id:"4a",p:"〜があります・います",g:"there is",t:"pattern",x:"Existence: あります for inanimate things, います for living things. The thing that exists is marked with が: ねこがいます (there is a cat)."},
    {id:"4b",p:"場所の言葉",g:"location words",x:"Position nouns used with の: つくえのうえ (on the desk), いえのなか (inside the house). Pattern: [place]の[position]に."},
    {id:"4c",p:"動詞ました",g:"polite past",t:"conj",x:"Polite past affirmative: replace ます with ました (たべました). The negative past is ませんでした."},
    {id:"4d",p:"〜でした",g:"past of です",x:"Past of です for nouns and な-adjectives: がくせいでした (was a student). The negative is じゃなかったです."},
    {id:"4e",p:"〜と",g:"and / with",t:"particle",x:"と joins two nouns as 'and' (ほんとペン) or marks a companion, 'with' (ともだちといく). It only connects nouns, not full sentences."},
    {id:"4f",p:"たくさん・〜時間",g:"quantity / duration",x:"Words like たくさん (a lot) and time durations (いちじかん) attach directly to the verb with no particle."}],
 5:[{id:"5a",p:"い形容詞",g:"i-adjectives",t:"pattern",x:"Adjectives ending in い. Negative drops い and adds くない (たかくない); past is かった (たかかった); past negative くなかった. Irregular: いい becomes よくない / よかった."},
    {id:"5b",p:"な形容詞",g:"na-adjectives",x:"Adjectives that take な before a noun (しずかなまち). They pattern like nouns: negative じゃないです, past でした. They never take い-adjective endings."},
    {id:"5c",p:"〜がすき・きらい",g:"like / dislike",t:"pattern",x:"The thing liked or disliked is marked with が, not を: コーヒーがすきです. すき and きらい are な-adjectives, so they conjugate like nouns."},
    {id:"5d",p:"〜ましょう・ましょうか",g:"let's / shall we",t:"pattern",x:"ましょう = 'let's' (たべましょう). ましょうか proposes or offers to do something ('shall I/we?'). Both build on the verb stem."},
    {id:"5e",p:"数え方",g:"counting",x:"Number + counter, where the reading often shifts: いっぽん, にほん, さんぼん. Different counters apply to different kinds of objects."}],
 6:[{id:"6a",p:"動詞て形",g:"te-form",x:"The connective form behind requests, permission, and linking. Sound changes: う/つ/る→って, む/ぶ/ぬ→んで, く→いて (but 行く is irregular: いって), ぐ→いで, す→して. る-verbs simply add て."},
    {id:"6b",p:"〜てください",g:"please do ~",t:"pattern",x:"A request, 'please do': みてください (please look). Attach ください to the て-form."},
    {id:"6c",p:"〜てもいいです",g:"may I ~",x:"Permission, 'may I/you': たべてもいいですか (may I eat?). Formed from the て-form plus もいいです."},
    {id:"6d",p:"〜てはいけません",g:"must not ~",x:"Prohibition, 'must not': たべてはいけません. て-form plus はいけません; casually ては contracts to ちゃ."},
    {id:"6e",p:"〜から",g:"because",t:"pattern",x:"'because', placed after the reason clause: たかいですから、かいません (it is expensive, so I will not buy it). The reason comes first."},
    {id:"6f",p:"二つの動作",g:"joining actions",x:"Use the て-form to chain actions in order: おきて、たべて、いきます (get up, eat, then go). The final verb sets the tense for the whole chain."}],
 7:[{id:"7a",p:"〜ている",g:"progressive / state",x:"て-form plus いる shows an ongoing action (たべている, is eating) or a resulting state (しっている, know). Context decides which reading applies."},
    {id:"7b",p:"〜は〜が長いです",g:"describing features",x:"Describes a feature of something: メアリーさんはかみがながいです (Mary's hair is long). Topic marked with は, the specific feature with が."},
    {id:"7c",p:"て形で文をつなぐ",g:"joining sentences",x:"The て-form also links adjectives and clauses: やすくて、おいしい (cheap and tasty). For な-adjectives and nouns, use で instead."},
    {id:"7d",p:"動詞stem + に行く",g:"go in order to ~",x:"Go somewhere to do something: たべにいく (go to eat). Verb stem + に + いく / くる / かえる."},
    {id:"7e",p:"人の数え方",g:"counting people",x:"Counting people: ひとり (1), ふたり (2), then 〜にん (さんにん). ひとり and ふたり are irregular readings."}],
 8:[{id:"8a",p:"短い形（普通形）",g:"plain forms",x:"Casual/plain forms used in speech and before many grammar patterns. Present affirmative is the dictionary form; present negative is the ない-form. Past plain forms come in L9."},
    {id:"8b",p:"くだけた話し方",g:"informal speech",x:"Informal speech drops です/ます for plain forms and often trims particles: たべる? instead of たべますか. Used with close friends and family."},
    {id:"8c",p:"〜と思います・言っていました",g:"I think / said",x:"Quote a thought with 〜とおもいます (I think that...) or reported speech with 〜といっていました (said that...). The quoted part goes in plain form before と."},
    {id:"8d",p:"〜ないでください",g:"please don't ~",x:"'please do not': たべないでください. Attach でください to the ない-form."},
    {id:"8e",p:"〜のが好きです",g:"like doing ~",x:"Like doing something: たべるのがすきです. The plain-form verb plus の turns the action into a noun so すき can apply."},
    {id:"8f",p:"が",g:"but",x:"Sentence-linking が means 'but': たかいですが、かいます (it is expensive, but I will buy it). Distinct from the subject-marking が."},
    {id:"8g",p:"何か・何も",g:"something / nothing",x:"なにか = 'something'; なにも + negative = 'nothing'. だれか/だれも and どこか/どこも follow the same pattern."}],
 9:[{id:"9a",p:"過去の短い形",g:"plain past",x:"Plain past. Affirmative uses the た-form (たべた, のんだ) with the same sound changes as the て-form. Negative past is なかった (たべなかった)."},
    {id:"9b",p:"名詞を修飾する",g:"qualifying nouns",x:"A plain-form verb or clause can modify a noun directly: きのうたべたパン (the bread I ate yesterday). The modifying clause comes before the noun."},
    {id:"9c",p:"まだ〜ていません",g:"haven't ~ yet",x:"'have not done yet': まだたべていません. Uses ている in the negative to show the action is still pending."},
    {id:"9d",p:"〜から（普通形）",g:"because (plain)",x:"から (because) also attaches to plain forms in casual or connected speech: たべたから (because I ate)."}],
 10:[{id:"10a",p:"〜より〜のほうが",g:"comparing two",x:"Compare two items: AよりBのほうが〜 means B is more 〜 than A. のほうが marks the one that is 'more'."},
    {id:"10b",p:"〜がいちばん",g:"comparing three+",x:"Superlative among three or more: このなかでこれがいちばんたかい (this is the most expensive of these). いちばん means 'number one / most'."},
    {id:"10c",p:"形容詞・名詞 + の",g:"~ one",x:"の replaces a repeated noun, like English 'one': たかいの (the expensive one). It avoids saying the noun twice."},
    {id:"10d",p:"〜つもりだ",g:"intend to ~",x:"State an intention: いくつもりです (I intend to go). Plain-form verb plus つもり."},
    {id:"10e",p:"形容詞 + なる",g:"become ~",x:"Become: い-adjectives drop い and add くなる (たかくなる); な-adjectives and nouns take に + なる (げんきになる)."},
    {id:"10f",p:"どこかに・どこにも",g:"somewhere / nowhere",x:"どこかに = 'somewhere'; どこにも + negative = 'nowhere'. The particle attaches after か or も."},
    {id:"10g",p:"〜で（手段）",g:"by means of",x:"で also marks the means or tool: でんしゃでいく (go by train), はしでたべる (eat with chopsticks)."}],
 11:[{id:"11a",p:"〜たい",g:"want to ~",x:"Express wanting to do something: たべたい (want to eat). Verb stem + たい, which then conjugates like an い-adjective (たべたくない). In plain statements it describes only the speaker's own desire."},
    {id:"11b",p:"〜たり〜たりする",g:"do things like ~",x:"List representative, non-exhaustive actions: たべたり、のんだりする (do things like eat and drink). Built from the た-form plus り."},
    {id:"11c",p:"〜ことがある",g:"have done ~ before",x:"Talk about experience: いったことがある (have been there before). た-form plus ことがある."},
    {id:"11d",p:"noun A や noun B",g:"A and B, etc.",x:"や lists nouns non-exhaustively ('and, among others'): ほんやペン. Unlike と, it implies there is more not mentioned."}],
 12:[{id:"12a",p:"〜んです",g:"explanation",x:"Adds explanatory nuance ('the thing is...'): いくんです. Plain form + んです, but な-adjectives and nouns use なんです. Very common in questions and giving reasons."},
    {id:"12b",p:"〜すぎる",g:"too much ~",x:"'too much': たべすぎる (eat too much). Verb stem or adjective stem + すぎる, which conjugates like a る-verb."},
    {id:"12c",p:"〜ほうがいいです",g:"had better ~",x:"Advice, 'had better': たべたほうがいいです. Affirmative advice normally uses the past (た) form; 'had better not' uses the ない-form."},

};
function genPattern(kv){var PATL={identity:1,masenka:3,arimasu:4,mashou:5,iadj:5,tekudasai:6};var keys=Object.keys(PAT).filter(function(k){return (PATL[k]||1)<=S.lesson;});if(!keys.length)return{error:"No pattern unlocked at this lesson yet."};for(var i=0;i<8;i++){var it=PAT[pick(keys)](kv);if(it)return it;}return{error:"Not enough vocab for a pattern drill yet."};}

/* conjugation drill */
function answerAlts(v,f){var out=[f.b(v)];if(v.kanji)out.push(f.b({kana:v.kanji,vtype:v.vtype}));if(v.kana==="くる")out.push(f.b(v).replace(/^[きこ]/,"来"));return out.filter(function(x,i,a){return a.indexOf(x)===i;});}
function genConj(kv){var forms=FORMS.filter(function(f){return f.minL<=S.lesson;});var verbs=allVerbs(kv);
 if(!forms.length||!verbs.length)return{error:"No conjugation forms unlocked yet."};
 var v=pick(verbs),f=pick(forms);var alts=answerAlts(v,f);
 return{kind:"conj",verb:(v.kanji||v.kana),verbKana:v.kana,formLabel:f.label,answer:alts[0],alts:alts,english:v.en,hint:v.vtype+" verb"};}

function genGrammar(kv,cat){
 if(cat==="particle")return genParticle(kv);
 if(cat==="conj")return genConj(kv);
 if(cat==="pattern")return genPattern(kv);
 var r=Math.random();if(r<0.34)return genParticle(kv);if(r<0.67)return genConj(kv);return genPattern(kv);
}

/* ===== READING ===== */
function disp(v){return v.kanji?v.kanji:v.kana;}
var SENT={
 masu:function(kv){var v=pick(transVerbs(kv));if(!v)return null;var o=objectFor(kv,v);if(!o)return null;return{k:disp(o)+"を"+vForm(v.kana,v.vtype,"masu"),r:o.kana+"を"+vForm(v.kana,v.vtype,"masu"),e:"I "+v.eng.base+" "+o.en+"."};},
 suki:function(kv){var p=pick(nounsBy(kv,"person"));var o=objectFor(kv,{objCats:["food","drink","watch","read","generic"]});if(!p||!o)return null;return{k:disp(p)+"は"+disp(o)+"が すきです",r:p.kana+"は"+o.kana+"が すきです",e:subjEn(p)+" like"+(p.kana==="わたし"?"":"s")+" "+o.en+"."};},
 iadj:function(kv){var a=pick(kv.filter(function(v){return v.pos==="iadj"&&v.kana!=="おいしい";}));var o=pick(nounsBy(kv,"thing"));if(!a||!o)return null;return{k:"この"+disp(o)+"は"+disp(a)+"です",r:"この"+o.kana+"は"+a.kana+"です",e:"This "+o.en+" is "+a.en+"."};},
 iku:function(kv){var pl=pick(nounsBy(kv,"place"));if(!pl)return null;return{k:disp(pl)+"に いきます",r:pl.kana+"に いきます",e:"I go to the "+pl.en+"."};},
 mashita:function(kv){var v=pick(transVerbs(kv));if(!v)return null;var o=objectFor(kv,v);if(!o)return null;return{k:"きのう"+disp(o)+"を"+mStem(v.kana,v.vtype)+"ました",r:"きのう"+o.kana+"を"+mStem(v.kana,v.vtype)+"ました",e:"Yesterday I "+v.eng.past+" "+o.en+"."};}
};
function genReadingOffline(kv){var avail=Object.keys(SENT);var n=2+Math.floor(Math.random()*2),ks=[],rs=[],es=[];
 for(var i=0;i<12&&ks.length<n;i++){var s=SENT[pick(avail)](kv);if(s){ks.push(s.k);rs.push(s.r);es.push(s.e);}}
 if(!ks.length)return{error:"Not enough vocab yet. Import a deck in 進度."};
 return{japanese:ks.join("。")+"。",reading:rs.join("。")+"。",english:es.join(" ")};}

/* ===== DICTIONARY HELPERS ===== */
function relatedFor(v,all){var pool=v.pos==="noun"?all.filter(function(x){return x.pos==="noun"&&x.sub===v.sub&&x.kana!==v.kana;}):all.filter(function(x){return x.pos===v.pos&&x.kana!==v.kana;});return pool.slice(0,6);}
function exampleFor(v){
 if(v.pos==="verb"){var m=mStem(v.kana,v.vtype)+"ます";return{k:"まいにち"+m,r:"まいにち"+m,e:"I "+v.eng.base+" every day."};}
 if(v.pos==="iadj")return{k:"この本は"+disp(v)+"です",r:"このほんは"+v.kana+"です",e:"This book is "+v.en+"."};
 if(v.pos==="naadj")return{k:"この家は"+disp(v)+"です",r:"このいえは"+v.kana+"です",e:"This house is "+v.en+"."};
 if(v.sub==="place")return{k:disp(v)+"に いきます",r:v.kana+"に いきます",e:"I go to the "+v.en+"."};
 return{k:disp(v)+"が すきです",r:v.kana+"が すきです",e:"I like "+v.en+"."};
}

  supaSession().then(function(u){if(u){sst.textContent="✓ logged in as "+u.email;var slo=el('<button class="btn ghost" style="margin-top:8px">log out</button>');slo.onclick=async function(){var s2=await getSupa();await s2.auth.signOut();_user=null;render();};sbd.appendChild(slo);}else{sst.textContent="not logged in";}});
 }
 b5.appendChild(sbd);sec.appendChild(b5);
 main.appendChild(sec);
}

function renderStats(main){
 var sec=el('<section></section>');
 var cats=[["conj","活用 conjugation"],["particle","助詞 particles"],["pattern","文型 patterns"],["vocab","語彙 vocab"]];
 var any=false;
 cats.forEach(function(c){
  var data=S.stats[c[0]]||{};var keys=Object.keys(data);
  var block=el('<div class="block"><div class="block-h">'+c[1]+'</div></div>');
  if(!keys.length){block.appendChild(el('<p class="note">No attempts yet.</p>'));sec.appendChild(block);return;}
  any=true;var tot=0,cor=0;keys.forEach(function(k){tot+=data[k].c+data[k].w;cor+=data[k].c;});
  block.appendChild(el('<div class="stats" style="margin-bottom:12px"><div><b>'+Math.round(100*cor/Math.max(1,tot))+'%</b><span>accuracy</span></div><div><b>'+tot+'</b><span>attempts</span></div></div>'));
  var rows=keys.map(function(k){var e=data[k];var n=e.c+e.w;return {k:k,n:n,acc:e.c/n,w:e.w};});
  rows=rows.filter(function(r){return r.w>0;}).sort(function(a,b){return a.acc-b.acc||b.w-a.w;}).slice(0,6);
  if(rows.length){block.appendChild(el('<div class="hint" style="margin-bottom:6px">weakest points</div>'));
   var ul=el('<ul class="glist"></ul>');
   rows.forEach(function(r){ul.appendChild(el('<li><span class="gp">'+esc(r.k)+'</span><span class="gg">'+Math.round(100*r.acc)+'% · '+r.w+' missed</span></li>'));});
   block.appendChild(ul);
  } else { block.appendChild(el('<p class="note">All correct so far.</p>')); }
  sec.appendChild(block);
 });
 if(!any) sec.appendChild(el('<p class="note">Do some grammar or vocab drills and your accuracy and weakest points show up here.</p>'));
 var rst=el('<button class="btn ghost" style="margin-top:8px">reset stats</button>');
 rst.onclick=function(){if(confirm("Clear all stats?")){S.stats={conj:{},particle:{},pattern:{},vocab:{}};commit();render();}};
 sec.appendChild(rst);main.appendChild(sec);
}

function conjStd(word,vtype){var w=(word||"").trim();if(!w)return null;var t=vtype||guessType(w);var f;
 if(t==="irregular"){
  if(w==="する")f={masu:"します",masen:"しません",mashita:"しました",masenP:"しませんでした",dict:"する",nai:"しない",ta:"した",nakatta:"しなかった",te:"して",mashou:"しましょう",vol:"しよう",pot:"できる",ba:"すれば",tara:"したら",pass:"される",caus:"させる",imp:"しろ",tai:"したい"};
  else if(w==="くる"||w==="来る")f={masu:"きます",masen:"きません",mashita:"きました",masenP:"きませんでした",dict:w,nai:"こない",ta:"きた",nakatta:"こなかった",te:"きて",mashou:"きましょう",vol:"こよう",pot:"こられる",ba:"くれば",tara:"きたら",pass:"こられる",caus:"こさせる",imp:"こい",tai:"きたい"};
  else return null;
 } else if(t==="ichidan"){var s=w.slice(0,-1);
  f={masu:s+"ます",masen:s+"ません",mashita:s+"ました",masenP:s+"ませんでした",dict:w,nai:s+"ない",ta:s+"た",nakatta:s+"なかった",te:s+"て",mashou:s+"ましょう",vol:s+"よう",pot:s+"られる",ba:s+"れば",tara:s+"たら",pass:s+"られる",caus:s+"させる",imp:s+"ろ",tai:s+"たい"};
 } else {
  f={masu:gStem(w,"i")+"ます",masen:gStem(w,"i")+"ません",mashita:gStem(w,"i")+"ました",masenP:gStem(w,"i")+"ませんでした",dict:w,nai:gStem(w,"a")+"ない",ta:gTe(w,true),nakatta:gStem(w,"a")+"なかった",te:gTe(w,false),mashou:gStem(w,"i")+"ましょう",vol:gStem(w,"o")+"う",pot:gStem(w,"e")+"る",ba:gStem(w,"e")+"ば",tara:gTe(w,true)+"ら",pass:gStem(w,"a")+"れる",caus:gStem(w,"a")+"せる",imp:gStem(w,"e"),tai:gStem(w,"i")+"たい"};
 }
 return [{title:"polite ます",rows:[["present",f.masu],["negative",f.masen],["past",f.mashita],["past neg.",f.masenP]]},
  {title:"plain \u666e\u901a",rows:[["present (dict.)",f.dict],["negative",f.nai],["past",f.ta],["past neg.",f.nakatta]]},
  {title:"\u3066-form",rows:[["\u3066",f.te]]},
  {title:"volitional",rows:[["let's (\u307e\u3057\u3087\u3046)",f.mashou],["plain (\u3088\u3046/\u304a\u3046)",f.vol]]},
  {title:"potential",rows:[["can ~",f.pot]]},
  {title:"conditional",rows:[["\u3070",f.ba],["\u305f\u3089",f.tara]]},
  {title:"passive / causative",rows:[["passive",f.pass],["causative",f.caus]]},
  {title:"imperative",rows:[["command",f.imp]]},
  {title:"desire",rows:[["want to (\u305f\u3044)",f.tai]]}];
}
function crowsG(secs){var d=el('<div class="crows"></div>');secs.forEach(function(sc){d.appendChild(el('<div class="cgroup">'+esc(sc.title)+'</div>'));sc.rows.forEach(function(r){d.appendChild(el('<div class="crow"><span class="ck">'+esc(r[0])+'</span><span class="cv">'+esc(r[1])+'</span></div>'));});});return d;}
function crows(t){var d=el('<div class="crows"></div>');Object.keys(t).forEach(function(k){d.appendChild(el('<div class="crow"><span class="ck">'+esc(k)+'</span><span class="cv">'+esc(t[k])+'</span></div>'));});return d;}

function rDict(main,kv,kg){
 var sec=el('<section></section>');
 var b1=el('<div class="block"><div class="block-h">辞書 · dictionary</div></div>');
 b1.appendChild(el('<p class="note">Type romaji, kana, kanji, or English. Romaji converts to kana as you type. Tap an entry for related words, an example sentence, and (for verbs) conjugations.</p>'));
 var inp=el('<input class="dict-in" placeholder="taberu / たべる / 食べる / eat">');b1.appendChild(inp);
 var live=el('<div class="kana-live"></div>');b1.appendChild(live);var res=el('<div></div>');b1.appendChild(res);
 function search(){var raw=inp.value.trim();var kana=romajiToKana(raw);
  live.textContent=raw&&/[a-zA-Z]/.test(raw)?"→ "+kana:"";
  if(!raw){res.innerHTML="";return;}var q=raw.toLowerCase();
  var hits=kv.filter(function(v){return (v.kana&&v.kana.indexOf(kana)>-1)||(v.kana&&v.kana.indexOf(raw)>-1)||(v.kanji&&v.kanji.indexOf(raw)>-1)||(v.en&&v.en.toLowerCase().indexOf(q)>-1);}).slice(0,12);
  res.innerHTML="";
  if(!hits.length){res.appendChild(el('<p class="note">No match in your set. '+(S.apiKey?'':'Add an API key in 進度 to look up any word.')+'</p>'));
   if(S.apiKey){var lb=el('<button class="btn ghost">AIで調べる · look up "'+esc(raw)+'"</button>');lb.onclick=function(){aiLookup(raw,res);};res.appendChild(lb);}return;}
  hits.forEach(function(v){
   var e=el('<div class="entry"></div>');
   e.appendChild(el('<div class="entry-top"><span class="entry-k">'+esc(v.kanji||v.kana)+'</span><span class="entry-r">'+esc(v.kana)+'</span><span class="entry-pos">'+esc(v.pos)+'</span></div>'));
   e.appendChild(el('<div class="entry-en">'+esc(v.en)+'</div>'));
   var det=el('<div class="detail" style="display:none"></div>');
   var ex=exampleFor(v);
   det.appendChild(el('<div class="detail-h">used in a sentence</div>'));
   det.appendChild(el('<div class="exs"><div class="exj">'+esc(ex.k)+'</div><div class="exr">'+esc(ex.r)+'</div><div class="exe">'+esc(ex.e)+'</div></div>'));
   var rel=relatedFor(v,kv);
   if(rel.length){det.appendChild(el('<div class="detail-h">related words</div>'));var ch=el('<div class="chips"></div>');
    rel.forEach(function(rv){var c=el('<button class="chip">'+esc(rv.kanji||rv.kana)+'</button>');c.onclick=function(ev){ev.stopPropagation();inp.value=rv.kana;search();window.scrollTo(0,0);};ch.appendChild(c);});det.appendChild(ch);}
   if(v.pos==="verb"){var tb=conjStd(v.kana,v.vtype||guessType(v.kana));if(tb){det.appendChild(el('<div class="detail-h">conjugation</div>'));det.appendChild(crowsG(tb));}}
   e.appendChild(det);
   e.onclick=function(){det.style.display=det.style.display==="none"?"block":"none";};
   res.appendChild(e);});
 }
 inp.oninput=search;sec.appendChild(b1);
 var b2=el('<div class="block"><div class="block-h">活用 · conjugate any verb</div></div>');
 var crow=el('<div class="row"></div>');var cin=el('<input class="inp" value="のむ" placeholder="dictionary form">');
 var csel=el('<select class="sel"><option value="godan">godan (う-verb)</option><option value="ichidan">ichidan (る-verb)</option><option value="irregular">irregular</option></select>');
 csel.value=guessType("のむ");crow.appendChild(cin);crow.appendChild(csel);b2.appendChild(crow);
 var ctb=el('<div></div>');b2.appendChild(ctb);
 function drawc(){var t=conjStd(cin.value,csel.value);ctb.innerHTML="";if(t)ctb.appendChild(crowsG(t));else ctb.appendChild(el('<p class="note">Enter a verb or pick the type.</p>'));}
 cin.oninput=function(){csel.value=guessType(cin.value.trim());drawc();};csel.onchange=drawc;drawc();sec.appendChild(b2);
 var b3=el('<div class="block"><div class="block-h">文法 · Genki I grammar (through L'+S.lesson+')</div></div>');
 b3.appendChild(el('<p class="note">Tap any point for a short explanation and notable irregularities.</p>'));
 var ul=el('<ul class="glist"></ul>');var lastL=0;
 kg.forEach(function(g){if(g.lesson!==lastL){lastL=g.lesson;ul.appendChild(el('<div class="glesson">Lesson '+g.lesson+'</div>'));}
  var li=el('<li class="gitem"></li>');
  li.appendChild(el('<div class="gitem-top"><span class="gp">'+esc(g.p)+'</span><span class="gg">'+esc(g.g)+'</span>'+(g.t?'<span class="gt">drill</span>':'')+'</div>'));
  var x=el('<div class="gx" style="display:none">'+esc(g.x||"")+'</div>');li.appendChild(x);
  li.onclick=function(){x.style.display=x.style.display==="none"?"block":"none";};
  ul.appendChild(li);});
 b3.appendChild(ul);sec.appendChild(b3);
 main.appendChild(sec);
}
async function aiLookup(word,res){res.innerHTML='<p class="note">…</p>';try{var raw=await callAI(S.apiKey,"For the Japanese or English term below, give the standard Japanese (kanji + kana), a one-line English meaning, and one short example sentence with translation. Plain text, under 70 words.\n\nTerm: "+word);res.innerHTML='<div class="out"><p>'+esc(raw)+'</p></div>';}catch(e){res.innerHTML='<div class="err">Lookup failed.</div>';}}

function rNotes(main){
 var sec=el('<section></section>');
 var b1=el('<div class="block"><div class="block-h">メモ · mnemonic + tip</div></div>');
 var row=el('<div class="row"></div>');var inp=el('<input class="inp" placeholder="a word or grammar point (e.g. 〜てもいいです)">');
 var btn=el('<button class="btn">調べる</button>');row.appendChild(inp);row.appendChild(btn);b1.appendChild(row);var out=el('<div></div>');b1.appendChild(out);
 if(!S.apiKey)b1.appendChild(el('<p class="note">Mnemonics use AI. Add a key in 進度 → settings, or just save your own notes below.</p>'));
 btn.onclick=async function(){if(!inp.value.trim())return;if(!S.apiKey){out.innerHTML='<div class="err">No API key set (進度 → settings).</div>';return;}
  btn.disabled=true;btn.textContent="…";out.innerHTML="";
  try{var raw=await callAI(S.apiKey,"You help a Genki-level learner. For this word or grammar point, give a one-line meaning, a short memorable mnemonic, and one usage tip. Under 90 words, plain sentences, no headers.\n\nItem: "+inp.value.trim());
   var q=inp.value.trim();var o=el('<div class="out"><p>'+esc(raw)+'</p></div>');var sv=el('<button class="btn ghost">保存 · save</button>');
   sv.onclick=function(){S.notes.unshift({id:Date.now(),title:q,body:raw});commit();render();};o.appendChild(sv);out.appendChild(o);
  }catch(e){out.innerHTML='<div class="err">Request failed.</div>';}btn.disabled=false;btn.textContent="調べる";};
 sec.appendChild(b1);
 var b3=el('<div class="block"><div class="block-h">手書きメモ · your note</div></div>');
 var mt=el('<input class="inp" placeholder="title" style="margin-bottom:8px">');b3.appendChild(mt);
 var mb=el('<textarea class="ta" rows="3" placeholder="write anything"></textarea>');b3.appendChild(mb);
 var madd=el('<button class="btn ghost">保存 · save</button>');madd.onclick=function(){if(!mt.value.trim()&&!mb.value.trim())return;S.notes.unshift({id:Date.now(),title:mt.value.trim()||"(untitled)",body:mb.value.trim()});commit();render();};b3.appendChild(madd);sec.appendChild(b3);
 if(S.notes.length){var b2=el('<div class="block"><div class="block-h">保存したメモ</div></div>');var ul=el('<ul class="saved"></ul>');
  S.notes.forEach(function(n){var li=el('<li><div class="saved-t">'+esc(n.title)+'</div><div class="saved-b">'+esc(n.body)+'</div></li>');var x=el('<button class="x">×</button>');x.onclick=function(){S.notes=S.notes.filter(function(z){return z.id!==n.id;});commit();render();};li.appendChild(x);ul.appendChild(li);});
  b2.appendChild(ul);sec.appendChild(b2);}
 main.appendChild(sec);
}

render();
